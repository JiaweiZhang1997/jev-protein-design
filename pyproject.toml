[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-protein-design"
version = "0.1.0"
description = "A toy protein sequence generator driven by Jev's typed choices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
jev-protein-design = "jev_protein_design.cli:main"
jev-protein-design-db = "jev_protein_design.local_blast:main"
jev-protein-design-check = "jev_protein_design.local_blast:check_main"

[tool.setuptools.packages.find]
where = ["src"]
